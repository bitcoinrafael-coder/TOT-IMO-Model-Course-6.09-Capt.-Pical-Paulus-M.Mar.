<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOT IMO Model Course 6.09 — Pengembangan Instruktur Pelayaran Maritim</title>
<style>
:root{
  --navy:#0a2342; --navy2:#14375e; --navy3:#1d4e89;
  --teal:#0d9488; --teal-l:#ccfbf1;
  --gold:#f59e0b; --gold-l:#fef3c7;
  --purple:#7c3aed; --purple-l:#ede9fe;
  --blue:#2563eb; --blue-l:#dbeafe;
  --coral:#e11d48; --coral-l:#ffe4e6;
  --green:#059669; --green-l:#d1fae5;
  --bg:#eef2f7; --card:#ffffff; --line:#dbe3ec;
  --txt:#12263f; --muted:#5b7290;
  --r:14px; --shadow:0 4px 18px rgba(10,35,66,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.65;font-size:15px}

/* ===== LAYOUT ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:300px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,#071a33 100%);color:#cfe0f5;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;display:flex;flex-direction:column;transition:transform .3s}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:#2b4a72;border-radius:8px}
.brand{padding:20px 18px 14px;border-bottom:1px solid #1c3a5e}
.brand .imo{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:700}
.brand h1{font-size:14.5px;color:#fff;line-height:1.4;margin-top:6px;font-weight:700}
.brand p{font-size:11px;color:#8fb0d4;margin-top:6px;line-height:1.45}
.brand .pres{margin-top:8px;padding:6px 9px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:7px;font-size:10.5px;color:#fcd34d;font-weight:600;line-height:1.35}
.nav{padding:10px 12px;flex:1}
.nav-lbl{font-size:10px;letter-spacing:1.6px;color:#6f8fb5;padding:14px 10px 6px;font-weight:700}
.nav button,.nav a{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#b9d0ea;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;transition:.18s;margin-bottom:2px;text-decoration:none}
.nav button:hover,.nav a:hover{background:#16375c;color:#fff}
.nav button.active{background:linear-gradient(90deg,var(--navy3),#24578f);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.nav button .ic,.nav a .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav button .arrow,.nav a .arrow{margin-left:auto;font-size:11px;opacity:.6}
.side-foot{padding:12px 16px;border-top:1px solid #1c3a5e;font-size:11px;color:#7a99bd}
.prog-wrap{height:6px;background:#1c3a5e;border-radius:6px;overflow:hidden;margin-top:8px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--teal),#34d399);width:0;transition:width .4s}

.main{margin-left:300px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
.burger{display:none;background:var(--navy);color:#fff;border:0;width:38px;height:38px;border-radius:9px;font-size:18px;cursor:pointer}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--navy)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:600;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f3f7fc;border-color:#b9cbe0}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy3)}
.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.gold{background:var(--gold);color:#3a2600;border-color:var(--gold)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.content{padding:24px;max-width:1180px;width:100%}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;border:1px solid #e6edf5}
.card h2{font-size:20px;color:var(--navy);margin-bottom:6px;line-height:1.3}
.card h3{font-size:16px;color:var(--navy2);margin:20px 0 10px}
.card h4{font-size:14px;color:var(--navy3);margin:16px 0 8px}
.sub{color:var(--muted);font-size:13px}

/* ===== HERO ===== */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#173f6b 55%,#0d9488 140%);color:#fff;border-radius:var(--r);padding:32px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:'⚓';position:absolute;right:24px;bottom:-30px;font-size:150px;opacity:.07}
.hero .tag{display:inline-block;background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.5);color:#fcd34d;font-size:10.5px;letter-spacing:2px;padding:4px 12px;border-radius:20px;font-weight:700}
.hero h1{font-size:26px;margin:14px 0 8px;line-height:1.25}
.hero p{color:#c3d9f0;font-size:14px;max-width:760px}
.hero .pres-box{margin-top:18px;padding:10px 15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;display:inline-block}
.hero .pres-box b{color:#fcd34d;display:block;font-size:12px;letter-spacing:1.5px;margin-bottom:3px}
.hero .pres-box span{color:#fff;font-size:15px;font-weight:600}
.hero .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:#a8c6e4}
.hero .meta span b{color:#fff;display:block;font-size:15px;margin-bottom:2px}

/* ===== GRID ===== */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* ===== STAT ===== */
.stat{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--line);border-left:4px solid var(--teal)}
.stat .n{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.6px}

/* ===== MODULE CARD ===== */
.mod-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:18px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px;position:relative}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(10,35,66,.12);border-color:#b8cde4}
.mod-card .mnum{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--teal)}
.mod-card .mt{font-size:15px;font-weight:700;color:var(--navy);line-height:1.35}
.mod-card .mp{font-size:12px;color:var(--muted)}
.mod-card .mfoot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line)}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid #c3d4e6;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.chk.on{background:var(--teal);border-color:var(--teal)}

/* ===== TABS ===== */
.tabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:12px;border:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{flex:1;min-width:150px;border:0;background:transparent;padding:11px 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);transition:.18s;display:flex;align-items:center;gap:8px;justify-content:center}
.tab:hover{background:#f2f7fc}
.tab.active{color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.tab[data-t="pedagogi"].active{background:var(--blue)}
.tab[data-t="andragogi"].active{background:var(--teal)}
.tab[data-t="heutagogi"].active{background:var(--purple)}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== QUESTION BOX ===== */
.qbox{border-radius:12px;padding:18px 20px;margin-bottom:18px;border-left:5px solid}
.qbox.blue{background:var(--blue-l);border-color:var(--blue)}
.qbox.teal{background:var(--teal-l);border-color:var(--teal)}
.qbox.purple{background:var(--purple-l);border-color:var(--purple)}
.qbox .qlab{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;opacity:.75}
.qbox p{font-size:15px;font-weight:700;color:var(--navy);line-height:1.45}

/* ===== CONTENT BLOCKS ===== */
.blk{border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:14px;background:#fdfefe}
.blk h4{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--navy);margin:0 0 10px}
.blk h4 .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0}
.blk ul{margin:0;padding-left:20px}
.blk li{margin-bottom:7px;font-size:13.8px;color:#243b57}
.blk li::marker{color:var(--teal)}

/* ===== REF (klik kata → popup) ===== */
.ref{color:var(--navy3);font-weight:700;cursor:pointer;border-bottom:2px dotted var(--teal);padding:0 1px;transition:.15s;background:linear-gradient(to top, rgba(13,148,136,.08) 0%, transparent 60%)}
.ref:hover{background:var(--teal-l);color:var(--teal)}

/* ===== TABLE ===== */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;background:#fff;border-radius:10px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:11px 13px;font-size:11.5px;letter-spacing:.5px;font-weight:700}
.tbl td{padding:10px 13px;border-bottom:1px solid #eaf0f7;vertical-align:top;color:#26405e}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:nth-child(even) td{background:#f8fbfe}

/* ===== SCENARIO ===== */
.scen{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:11px;padding:16px 18px;margin-bottom:14px}
.scen .st{font-size:11px;font-weight:800;letter-spacing:1.2px;color:#b45309;text-transform:uppercase;margin-bottom:6px}
.scen p{font-size:13.6px;color:#28405d;margin-bottom:10px}
.scen .task{background:#fffbeb;border-radius:8px;padding:10px 13px;font-size:13px;color:#5c4708}
.scen .task b{color:#92400e}

/* ===== PROJECT ===== */
.proj{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:14px;border-top:4px solid var(--purple)}
.proj .pt{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.proj p{font-size:13.5px;color:#3a5270;margin-bottom:9px}
.proj .out{font-size:12.5px;background:var(--purple-l);color:#4c1d95;padding:9px 12px;border-radius:8px}
.proj .out b{color:#5b21b6}

/* ===== NOTES ===== */
.notes{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:13px;font-family:inherit;font-size:13.5px;resize:vertical;background:#fbfdff;color:var(--txt)}
.notes:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.save-hint{font-size:11.5px;color:var(--teal);margin-top:6px;height:16px}

/* ===== QUIZ ===== */
.qq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.qq .qn{font-size:11px;font-weight:800;color:var(--teal);letter-spacing:1px;margin-bottom:6px}
.qq .qt{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:12px;line-height:1.45}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;font-size:13.5px;transition:.15s;background:#fcfdff}
.opt:hover{background:#f2f8fd;border-color:#b9cfe6}
.opt input{margin-top:3px;accent-color:var(--teal);flex-shrink:0}
.opt.correct{background:#d1fae5;border-color:#34d399;font-weight:600}
.opt.wrong{background:#fee2e2;border-color:#f87171}
.opt.lock{cursor:default}
.score-box{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:12px;padding:26px;text-align:center;margin-bottom:18px}
.score-box .big{font-size:46px;font-weight:800;line-height:1}
.score-box p{color:#c3d9f0;margin-top:8px;font-size:14px}

/* ===== CHECKLIST ===== */
.cl-item{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fdfeff;font-size:13.6px;cursor:pointer;transition:.15s}
.cl-item:hover{background:#f4f9fd}
.cl-item input{margin-top:3px;accent-color:var(--teal);width:16px;height:16px;flex-shrink:0;cursor:pointer}
.cl-item.done{background:#f0fdf9;border-color:#a7f3d0;text-decoration:line-through;color:#4b7d70}

/* ===== DB TABLE ===== */
.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;margin-bottom:16px;background:#fff}
.search:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.4px}
.pill.p{background:var(--blue-l);color:#1e40af}
.pill.a{background:var(--teal-l);color:#115e59}
.pill.h{background:var(--purple-l);color:#5b21b6}
.pill.i{background:var(--coral-l);color:#9f1239}
.pill.g{background:var(--green-l);color:#065f46}

/* ===== MATRIX ===== */
.matrix{display:grid;grid-template-columns:170px repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.matrix>div{background:#fff;padding:13px 14px;font-size:12.8px;color:#28405d}
.matrix .mh{background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.4px;text-align:center}
.matrix .mrh{background:#f1f6fb;font-weight:700;color:var(--navy);font-size:12.5px}

/* ===== MISC ===== */
.callout{background:var(--gold-l);border-left:5px solid var(--gold);border-radius:10px;padding:14px 17px;font-size:13.5px;color:#5c4708;margin:14px 0}
.callout b{color:#92400e}
.quote{font-style:italic;color:var(--muted);border-left:3px solid var(--gold);padding-left:14px;margin:16px 0;font-size:14px}
.quote span{display:block;font-style:normal;font-size:12px;color:var(--navy);margin-top:6px;font-weight:600}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.overlay{display:none;position:fixed;inset:0;background:rgba(6,20,38,.55);z-index:45}
.overlay.on{display:block}

/* ===== POPUP MODAL ===== */
.popup-bg{display:none;position:fixed;inset:0;background:rgba(6,20,38,.65);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.popup-bg.on{display:flex;animation:fade .2s ease}
.popup{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.popup-head{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;padding:22px 26px 18px;position:sticky;top:0;z-index:1}
.popup-head .ptag{font-size:10px;letter-spacing:2px;color:#fcd34d;font-weight:700}
.popup-head h2{font-size:21px;margin-top:6px;line-height:1.25;color:#fff}
.popup-head .psub{font-size:12.5px;color:#a8c6e4;margin-top:5px;line-height:1.5}
.popup-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);border:0;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;transition:.15s}
.popup-close:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}
.popup-body{padding:22px 26px 26px}
.popup-body p{font-size:14px;color:#2c4562;margin-bottom:14px;line-height:1.7}
.popup-links{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.popup-links a{display:flex;align-items:center;gap:11px;padding:12px 15px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--navy);font-size:13.5px;font-weight:600;transition:.15s;background:#fbfdff}
.popup-links a:hover{background:var(--teal-l);border-color:var(--teal);transform:translateX(3px)}
.popup-links a .lic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--blue-l);color:var(--blue)}
.popup-links a.g .lic{background:#fef3c7;color:#92400e}
.popup-links a.i .lic{background:var(--green-l);color:var(--green)}
.popup-links a.w .lic{background:#e0e7ff;color:#3730a3}
.popup-links a .lmeta{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:500}
.related{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.related b{font-size:11px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.related .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.related .tags button{background:#f0f5fb;border:1px solid var(--line);color:var(--navy2);padding:5px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s}
.related .tags button:hover{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ===== GLOSSARY CARDS ===== */
.gloss-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.18s;border-left:4px solid var(--teal)}
.gloss-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(10,35,66,.1);border-left-color:var(--gold)}
.gloss-card .gt{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:4px}
.gloss-card .gf{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-style:italic}
.gloss-card .gd{font-size:12.8px;color:#3a5270;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gloss-card .gaction{margin-top:10px;font-size:11.5px;color:var(--teal);font-weight:700;display:flex;align-items:center;gap:5px}

/* ===== FLOATING GLOSSARY BUTTON ===== */
.fab{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,var(--teal),var(--navy3));color:#fff;border:0;width:58px;height:58px;border-radius:50%;cursor:pointer;font-size:22px;box-shadow:0 8px 24px rgba(13,148,136,.4);z-index:60;transition:.2s;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.08) rotate(-8deg);box-shadow:0 12px 30px rgba(13,148,136,.55)}

@media(max-width:960px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .main{margin-left:0}
  .burger{display:block}
  .content{padding:16px}
  .hero{padding:22px 18px}
  .hero h1{font-size:20px}
  .topbar{padding:10px 14px}
  .card{padding:18px}
  .matrix{grid-template-columns:1fr}
  .matrix .mh,.matrix .mrh{text-align:left}
}
@media print{
  .sidebar,.topbar,.overlay,.fab,.no-print{display:none!important}
  .main{margin-left:0}
  .panel{display:block!important}
  .card{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- ===== POPUP MODAL ===== -->
<div class="popup-bg" id="popupBg" onclick="if(event.target===this)closePopup()">
  <div class="popup" id="popupBox">
    <div class="popup-head" style="position:relative">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <div class="ptag" id="popTag">REFERENSI</div>
      <h2 id="popTitle">—</h2>
      <div class="psub" id="popSub">—</div>
    </div>
    <div class="popup-body">
      <p id="popDesc">—</p>
      <div class="popup-links" id="popLinks"></div>
      <div class="related" id="popRelated"></div>
    </div>
  </div>
</div>

<!-- ===== FLOATING GLOSSARY ===== -->

  ],exercises:["Pemetaan Regulasi → Kurikulum: ambil satu bab STCW, petakan kompetensinya ke mata kuliah yang Anda ampu.","Latihan cepat: dari 8 bab STCW, pilih 3 bab yang paling relevan dengan jabatan Anda.","Buat 'timeline interaktif' 1978–1995–2010 dan jelaskan dampaknya bagi pelaut Indonesia."],reflection:["Apa satu regulasi STCW yang paling sering disalahpahami di tempat kerja saya?","Jika saya hanya boleh mengajarkan satu hal tentang STCW, apa yang paling berdampak bagi keselamatan?"]},
  heutagogy:{intro:"Fokus: peserta MENENTUKAN SENDIRI cara belajar dan MENCIPTAKAN solusi/karya baru.",projects:[
    {t:"Proyek A — Audit Mandiri Lembaga Diklat",d:"Rancang sendiri checklist audit kepatuhan STCW untuk lembaga diklat Anda.",out:"<b>Luaran:</b> Dokumen checklist + laporan audit mini (5–8 halaman) + rekomendasi prioritas."},
    {t:"Proyek B — Media Pembelajaran Timeline STCW",d:"Ciptakan media ajar (video/infografis/podcast) yang menjelaskan evolusi STCW 1978–1995–2010.",out:"<b>Luaran:</b> Karya media + narasi 300 kata + rubrik penilaian."},
    {t:"Proyek C — Learning Contract Pribadi",d:"Susun kontrak belajar pribadi: target 30 hari, sumber belajar, bukti, cara mengukur diri.",out:"<b>Luaran:</b> Learning contract + log refleksi mingguan."}
  ],reflection:["Bagaimana saya paling efektif belajar?","Apa yang akan saya ciptakan dari materi ini yang belum ada sebelumnya?","Bukti apa yang menunjukkan saya benar-benar sudah memahami STCW?"]}

{
  id:"m2", num:2, icon:"🎯", pages:"Hal. 17–30",
  title:"Persyaratan STCW untuk Competence-Based Training (CBT)",
  en:"Understand STCW Convention and Code Requirement for Competence Based Training",
  summary:"Konsep CBT, dasar hukum, struktur kompetensi, metode pembelajaran, dan asesmen berbasis bukti.",
  objectives:["Menjelaskan konsep Competence-Based Training (CBT) dalam STCW.","Menjelaskan persyaratan STCW terkait pelatihan berbasis kompetensi.","Menjelaskan hubungan kompetensi–pelatihan–asesmen–sertifikasi.","Mengidentifikasi peran instruktur, supervisor, dan assessor dalam CBT.","Menerapkan prinsip CBT dalam perencanaan pelatihan maritim."],
  pedagogy:{intro:"Fokus: peserta memahami CBT sebagai SISTEM — bukan sekadar metode mengajar.",blocks:[
    {h:"1. Definisi CBT",items:["<ref>CBT</ref> = pendekatan pelatihan yang berfokus pada pencapaian kompetensi tertentu, bukan pada lamanya mengikuti pelatihan.","Peserta dinyatakan kompeten apabila mampu menunjukkan Pengetahuan, Keterampilan, dan Sikap Kerja sesuai standar STCW."]},
    {h:"2. Tiga Aspek Kompetensi (K-S-A)",items:["<b>Knowledge</b> — memahami teori, prinsip, dan prosedur.","<b>Skill</b> — mampu melaksanakan tugas secara benar dan aman.","<b>Attitude</b> — menunjukkan perilaku profesional, disiplin, dan bertanggung jawab."]},
    {h:"3. Empat Komponen Kompetensi dalam STCW",items:["Competence — kemampuan yang harus dimiliki.","Knowledge — pengetahuan yang mendukung kompetensi.","Understanding — pemahaman terhadap prinsip kerja.","Proficiency — kemampuan menerapkan pengetahuan secara efektif."]},
    {h:"4. Struktur Tabel Kompetensi STCW",items:["Setiap kompetensi disusun dalam tabel dengan 4 elemen (lihat tabel).","Contoh: seorang <ref>OICNW</ref> harus mampu merencanakan dan melaksanakan navigasi sesuai standar kompetensi STCW."]},
    {h:"5. Dasar Hukum CBT",items:["<b>STCW Convention</b>: mengharuskan setiap negara peserta memastikan pelaut memenuhi standar kompetensi minimum sebelum diberi sertifikat.","<b><ref>Section A-I/6</ref></b>: pelatihan oleh Instruktur berkualifikasi; asesmen oleh Assessor kompeten; metode sesuai; bukti kompetensi dapat dipertanggungjawabkan.","<b><ref>Section A-I/8</ref></b>: lembaga diklat wajib menerapkan Sistem Manajemen Mutu."]},
    {h:"6. Karakteristik CBT",items:["Berorientasi pada hasil (learning outcomes).","Mengacu pada standar kompetensi STCW.","Mengintegrasikan teori dan praktik.","Menggunakan asesmen berbasis bukti (evidence-based assessment).","Mengakomodasi kecepatan belajar masing-masing peserta.","Menekankan kemampuan melakukan pekerjaan secara nyata."]},
    {h:"7. Metode Pembelajaran dalam CBT",items:["Ceramah interaktif · Demonstrasi · Praktik langsung · Simulasi · Latihan di kapal · Studi kasus · Diskusi kelompok · Role play · Computer-Based Training · Simulator.","Prinsip: pemilihan metode harus disesuaikan dengan kompetensi yang akan dicapai."]},
    {h:"8. Metode Asesmen",items:["Ujian tertulis · Ujian lisan · Demonstrasi praktik · Simulasi · Observasi langsung · Workplace assessment · Portofolio · Logbook pelatihan."]},
    {h:"9. Alur CBT",items:["Menetapkan standar kompetensi → Menyusun tujuan pembelajaran → Mengembangkan kurikulum → Melaksanakan pelatihan → Melakukan asesmen → Memberikan umpan balik → Sertifikasi → Evaluasi & peningkatan."]},
    {h:"10. Manfaat CBT",items:["Menjamin lulusan kompeten sesuai standar internasional.","Meningkatkan keselamatan pelayaran.","Mengurangi human error.","Mendukung pengakuan sertifikat internasional.","Memenuhi kebutuhan industri pelayaran.","Meningkatkan kualitas pendidikan & pelatihan maritim."]}
  ],table:{head:["Elemen","Isi"],rows:[["Competence","Kompetensi yang harus dicapai."],["<ref>KUP</ref>","Materi yang harus dipelajari."],["Methods for Demonstrating Competence","Cara membuktikan kompetensi."],["Criteria for Evaluating Competence","Standar penilaian kompetensi."]]},callout:"<b>Inti CBT:</b> Bukan 'berapa lama belajar', tetapi 'apa yang sudah mampu dilakukan'."},
  andragogy:{intro:"Fokus: peserta merancang & memecahkan masalah nyata dalam penerapan CBT.",scenarios:[
    {t:"Skenario 1 — Merancang Sesi CBT",d:"Anda diminta merancang satu sesi pelatihan CBT untuk kompetensi Fire Prevention and Fire Fighting (STCW Table A-VI/1-2). Durasi 8 jam.",task:"<b>Tugas:</b> (1) Tuliskan rumusan Competence. (2) Susun KUP. (3) Pilih metode demonstrasi. (4) Tentukan kriteria evaluasi. (5) Rancang bukti asesmen."},
    {t:"Skenario 2 — Peserta Gagal Asesmen",d:"Seorang taruna gagal 3 kali dalam asesmen praktik pemadaman kebakaran. Nilai tertulis 90, tetapi panik saat praktik.",task:"<b>Analisis akar masalah:</b> Apakah masalahnya di metode pembelajaran, kesiapan peserta, kompetensi asesor, atau alat/simulator? Susun rencana intervensi 2 minggu."},
    {t:"Skenario 3 — Konversi Silabus",d:"Silabus lama berbasis waktu (16 jam teori, 8 jam praktik). Manajemen meminta konversi ke format berbasis kompetensi.",task:"<b>Tugas:</b> Ambil satu mata kuliah, konversikan menjadi tabel STCW (Competence – KUP – Methods – Criteria)."}
  ],exercises:["Tulis satu KUP lengkap untuk kompetensi yang Anda ampu.","Rancang rubrik penilaian 'attitude' yang objektif dan dapat diamati.","Bandingkan dua metode asesmen untuk satu kompetensi, tentukan mana yang lebih valid & reliabel.","Simulasi: nilai rekaman video praktik taruna menggunakan rubrik yang Anda buat."],reflection:["Apakah asesmen yang saya lakukan benar-benar mengukur kompetensi, atau hanya mengukur ingatan?","Bagaimana saya memastikan asesmen saya objektif dan tidak bias?"]},
  heutagogy:{intro:"Fokus: peserta menciptakan sendiri instrumen, rubrik, dan sistem asesmen.",projects:[
    {t:"Proyek A — Bangun Rubrik Asesmen Sendiri",d:"Pilih satu kompetensi STCW. Rancang rubrik asesmen lengkap dengan level pencapaian (Novice–Developing–Competent–Proficient), indikator perilaku, dan bukti objektif.",out:"<b>Luaran:</b> Rubrik siap pakai + panduan penggunaan untuk asesor lain."},
    {t:"Proyek B — Portofolio Belajar Pribadi",d:"Selama pelatihan, kumpulkan bukti belajar Anda. Susun menjadi portofolio kompetensi.",out:"<b>Luaran:</b> Portofolio digital + narasi reflektif 500 kata."},
    {t:"Proyek C — Desain Skenario Simulator",d:"Ciptakan skenario simulator (bridge/engine) yang menguji kompetensi spesifik, lengkap dengan briefing, injection, dan debriefing guide.",out:"<b>Luaran:</b> Paket skenario + lembar observasi + kriteria lulus/tidak lulus."}
  ],reflection:["Jika saya harus mengases kompetensi saya sendiri, bukti apa yang saya perlukan?","Apa yang membuat saya merasa 'benar-benar kompeten'?","Bagaimana saya akan terus memperbarui kompetensi saya setelah pelatihan ini?"]}
},

{
  id:"m3", num:3, icon:"🧩", pages:"Hal. 31–48",
  title:"Faktor-Faktor yang Memengaruhi Kegiatan Belajar-Mengajar",
  en:"Identify the Factors which Influence the Teaching and Learning Process",
  summary:"10 faktor penentu keberhasilan pembelajaran: dari instruktur hingga faktor eksternal.",
  objectives:["Mengidentifikasi faktor-faktor yang memengaruhi proses belajar-mengajar.","Menjelaskan pengaruh setiap faktor terhadap pencapaian hasil belajar.","Menerapkan strategi untuk meningkatkan efektivitas pembelajaran dalam konteks CBT."],
  pedagogy:{intro:"Fokus: peserta mengenali 10 faktor yang saling berkaitan dalam kegiatan belajar-mengajar.",blocks:[
    {h:"Pengantar",items:["Kegiatan belajar-mengajar adalah proses interaksi antara instruktur, peserta, materi, metode, dan lingkungan belajar untuk mencapai kompetensi sesuai STCW.","Keberhasilan pembelajaran dipengaruhi berbagai faktor yang saling berkaitan."]},
    {h:"1. Faktor Instruktur (Teacher Factors)",items:["Penguasaan materi · Kompetensi teknis · Kemampuan mengajar (pedagogik) · Komunikasi · Motivasi & antusiasme · Pengalaman mengajar · Kemampuan memberi umpan balik · Sikap profesional & integritas.","Instruktur adalah faktor UTAMA penentu keberhasilan.","<ref>Andragogy</ref> (Malcolm Knowles) — teori pembelajaran orang dewasa."]},
    {h:"2. Faktor Peserta Diklat (Learner Factors)",items:["Motivasi belajar · Minat · Pengetahuan & pengalaman sebelumnya · Gaya belajar (Visual, Auditori, Membaca/Menulis, Kinestetik) · Tingkat kecerdasan · Kondisi fisik & kesehatan · Kondisi psikologis · Disiplin & sikap belajar."]},
    {h:"3. Faktor Tujuan Pembelajaran",items:["Tujuan harus: Jelas · Spesifik · Terukur · Dapat dicapai · Relevan dengan kompetensi STCW."]},
    {h:"4. Faktor Materi Pembelajaran",items:["Sesuai kurikulum · Mengacu STCW · Aktual · Sistematis · Relevan dengan industri · Seimbang teori & praktik."]},
    {h:"5. Faktor Metode Pembelajaran",items:["Ceramah · Demonstrasi · Diskusi kelompok · Studi kasus · Simulasi · Role play · Praktik laboratorium · Simulator · On-board Training · Computer-Based Training."]},
    {h:"6. Faktor Media & Sarana",items:["PowerPoint · Whiteboard · Video · Model kapal · Peralatan keselamatan · Bridge simulator · Engine simulator · E-learning."]},
    {h:"7. Faktor Lingkungan Belajar",items:["Ruang kelas nyaman · pencahayaan cukup · ventilasi baik · kebersihan · kebisingan rendah · hubungan positif instruktur–peserta."]},
    {h:"8. Faktor Penilaian (Assessment)",items:["Harus: Objektif · Valid · Reliabel · Transparan · Berbasis kompetensi.","Metode: tes tertulis, tes lisan, demonstrasi, simulasi, observasi, portofolio, logbook."]},
    {h:"9. Faktor Manajemen Lembaga Diklat",items:["Kebijakan lembaga · Sistem manajemen mutu · Kompetensi instruktur · Jadwal pelatihan · Ketersediaan fasilitas · Dukungan administrasi · Pengembangan profesional."]},
    {h:"10. Faktor Eksternal",items:["Kondisi keluarga · Budaya · Ekonomi · Perkembangan teknologi · Regulasi pemerintah · Kebutuhan industri pelayaran · Perubahan standar internasional."]},
    {h:"Kaitan dengan STCW Code",items:["<b><ref>Section A-I/6</ref></b>: pembelajaran harus didukung instruktur kompeten, metode sesuai, fasilitas memadai, penilaian valid-objektif, lingkungan aman & mendukung.","<b><ref>Section A-I/8</ref></b>: lembaga diklat wajib menerapkan Sistem Manajemen Mutu."]}
  ],table:{head:["Faktor","Pengaruh"],rows:[["Instruktur","Kompetensi, metode, komunikasi, motivasi."],["Peserta Diklat","Motivasi, pengalaman, kemampuan, sikap."],["Tujuan Pembelajaran","Menentukan arah dan hasil."],["Materi Pembelajaran","Relevansi, sistematika, kesesuaian."],["Metode Pembelajaran","Efektivitas penyampaian & pencapaian."],["Media dan Sarana","Membantu pemahaman & keterlibatan."],["Lingkungan Belajar","Suasana aman dan kondusif."],["Penilaian","Mengukur pencapaian & umpan balik."],["Manajemen Lembaga","Menjamin mutu & dukungan."],["Faktor Eksternal","Kesiapan & keberhasilan belajar."]]},callout:"<b>Prinsip kunci:</b> Faktor-faktor ini <u>tidak berdiri sendiri</u> — kelemahan pada satu faktor akan menular ke faktor lain."},
  andragogy:{intro:"Fokus: peserta mendiagnosis masalah pembelajaran dan merancang intervensi.",scenarios:[
    {t:"Skenario 1 — Kelas yang 'Mati'",d:"Sebuah kelas taruna tingkat II menunjukkan hasil belajar rendah: 60% tidak lulus asesmen praktik. Instruktur mengeluh peserta pasif, sering mengantuk, dan tidak mengerjakan tugas. Fasilitas lengkap, jadwal normal.",task:"<b>Diagnosis (20 menit):</b> Gunakan kerangka 10 faktor. (1) Faktor mana yang paling mungkin menjadi akar masalah? (2) Data apa yang perlu dikumpulkan? (3) Rancang intervensi 4 minggu. (4) Tentukan indikator keberhasilan."},
    {t:"Skenario 2 — Analisis SWOT Pembelajaran",d:"Anda memimpin program diklat pelaut. Manajemen meminta laporan kesiapan program menghadapi audit mutu.",task:"<b>Tugas:</b> Lakukan SWOT terhadap 10 faktor pembelajaran. Identifikasi 3 kekuatan, 3 kelemahan, 3 peluang, 3 ancaman. Susun rencana aksi prioritas."},
    {t:"Skenario 3 — Instruktur Berkualitas Rendah",d:"Seorang instruktur sangat ahli secara teknis (mantan Chief Engineer) tetapi peserta mengeluh tidak bisa memahami penjelasannya.",task:"<b>Tugas:</b> Rancang program pengembangan profesional untuk instruktur ini. Fokus pada 'pedagogik' dan 'komunikasi'. Buat rencana 3 bulan dengan mentoring dan observasi kelas."}
  ],exercises:["Buat instrumen observasi kelas yang mencakup 10 faktor (minimal 3 indikator per faktor).","Lakukan observasi kelas rekan sejawat; berikan umpan balik konstruktif.","Identifikasi 3 faktor terlemah di lembaga Anda; hitung tingkat risikonya.","Rancang sesi pelatihan 2 jam untuk meningkatkan faktor 'motivasi peserta'."],reflection:["Faktor mana yang paling sering saya abaikan dalam mengajar?","Apa yang bisa saya perbaiki minggu ini tanpa anggaran tambahan?","Bagaimana saya mengukur dampak perbaikan faktor terhadap hasil belajar?"]},
  heutagogy:{intro:"Fokus: peserta menciptakan alat ukur, sistem, dan komunitas belajar sendiri.",projects:[
    {t:"Proyek A — Instrumen Evaluasi Diri Instruktur",d:"Rancang instrumen self-assessment bagi instruktur untuk mengevaluasi 10 faktor pembelajaran.",out:"<b>Luaran:</b> Instrumen lengkap + panduan interpretasi + template rencana perbaikan."},
    {t:"Proyek B — Program Mentoring Instruktur Baru",d:"Ciptakan program mentoring 6 bulan: kurikulum, jadwal, peran mentor-mentee, cara mengukur keberhasilan.",out:"<b>Luaran:</b> Buku panduan program mentoring + logbook mentoring."},
    {t:"Proyek C — Komunitas Praktik (Community of Practice)",d:"Bangun kerangka Community of Practice antar-instruktur maritim.",out:"<b>Luaran:</b> Proposal CoP + rencana 12 bulan + prototipe kanal komunikasi."},
    {t:"Proyek D — Peta Risiko Pembelajaran",d:"Buat peta risiko (risk map) untuk 10 faktor pembelajaran, dengan skala probabilitas × dampak dan mitigasi.",out:"<b>Luaran:</b> Risk register + heat map visual."}
  ],reflection:["Apa kebiasaan mengajar saya yang perlu saya hentikan, dan apa yang perlu saya mulai?","Jika saya mengajar dengan cara saya sendiri, bagaimana bentuknya?","Siapa yang bisa menjadi 'critical friend' saya untuk memberi umpan balik jujur?"]}
},

{
  id:"m4", num:4, icon:"🏫", pages:"Hal. 49–61",
  title:"Menciptakan Lingkungan Belajar yang Efektif",
  en:"Establish an Effective Learning Environment",
  summary:"Empat dimensi lingkungan belajar: fisik, psikologis, sosial, akademik — dan penerapannya dalam CBT.",
  objectives:["Menjelaskan pengertian lingkungan belajar yang efektif.","Mengidentifikasi unsur-unsur lingkungan belajar efektif.","Menerapkan strategi untuk menciptakan suasana kondusif.","Meningkatkan partisipasi & motivasi peserta.","Mengembangkan lingkungan belajar yang mendukung CBT sesuai STCW."],
  pedagogy:{intro:"Fokus: peserta memahami bahwa lingkungan belajar = kombinasi 4 dimensi yang saling menguatkan.",blocks:[
    {h:"1. Definisi",items:["Lingkungan belajar efektif adalah kondisi fisik, psikologis, sosial, dan akademik yang mendukung peserta belajar secara aktif, aman, nyaman, dan termotivasi.","Dalam pelatihan maritim, lingkungan belajar harus mendukung knowledge, skill, dan attitude sesuai STCW."]},
    {h:"2. Karakteristik Lingkungan Belajar Efektif",items:["Aman dan bebas bahaya · Nyaman, bersih, tertata · Menghargai peserta · Mendorong partisipasi aktif · Komunikasi terbuka · Disiplin konsisten · Berpusat pada peserta (learner-centered) · Mendukung kolaborasi."]},
    {h:"3. Unsur A — Lingkungan Fisik",items:["Ruang kelas bersih dan rapi · Pencahayaan & ventilasi baik · Suhu nyaman · Tata letak tempat duduk sesuai metode · Peralatan berfungsi baik · Akses simulator, laboratorium, alat praktik."]},
    {h:"4. Unsur B — Lingkungan Psikologis",items:["Suasana saling menghormati · Rasa aman untuk bertanya & berpendapat · Dukungan terhadap keberagaman · Penghargaan atas pencapaian · Hubungan positif instruktur–peserta."]},
    {h:"5. Unsur C — Lingkungan Sosial",items:["Kerja sama antar peserta · Komunikasi efektif · Saling menghargai · Penyelesaian konflik konstruktif · Budaya belajar positif."]},
    {h:"6. Unsur D — Lingkungan Akademik",items:["Tujuan pembelajaran jelas · Materi relevan · Metode bervariasi · Penilaian objektif · Umpan balik membangun."]},
    {h:"7. Peran Instruktur",items:["Menjadi teladan profesional · Menjelaskan tujuan pembelajaran · Membangun komunikasi efektif · Mendorong keterlibatan semua peserta · Mengelola kelas · Memberi motivasi & dukungan · Menghargai perbedaan kemampuan · Memberi umpan balik tepat waktu & konstruktif."]},
    {h:"8. Strategi Menciptakan Lingkungan Efektif",items:["Menetapkan aturan kelas sejak awal · Metode bervariasi · Melibatkan peserta dalam diskusi & praktik · Menghubungkan materi dengan pengalaman kerja nyata · Memberi kesempatan bertanya · Media menarik · Kelola waktu efektif · Beri penguatan (reinforcement) · Refleksi & evaluasi berkala."]},
    {h:"9. Hambatan yang Umum",items:["Kurangnya motivasi peserta · Gangguan/kebisingan · Fasilitas tidak memadai · Komunikasi kurang efektif · Metode monoton · Jumlah peserta terlalu banyak · Perbedaan kemampuan tidak dikelola · Kurangnya kesempatan praktik."]},
    {h:"10. Lingkungan Belajar dalam CBT",items:["Berorientasi pada pencapaian kompetensi · Memberi kesempatan praktik memadai · Menggunakan simulator & peralatan sesuai standar · Menyediakan umpan balik berkelanjutan · Mendorong pembelajaran aktif · Mendukung asesmen berbasis kompetensi."]},
    {h:"11. Contoh Penerapan di Maritim",items:["<b>Di kelas:</b> diskusi interaktif prosedur keselamatan kapal.","<b>Di laboratorium/simulator:</b> latihan navigasi, operasi mesin, pemadaman kebakaran.","<b>Di kapal latih:</b> pembagian tugas sesuai kompetensi, briefing sebelum praktik, debriefing setelah latihan."]}
  ],table:{head:["Unsur","Karakteristik"],rows:[["Fisik","Aman, bersih, nyaman, fasilitas memadai."],["Psikologis","Menghargai, mendukung, bebas dari rasa takut."],["Sosial","Kerja sama, komunikasi, saling menghormati."],["Akademik","Tujuan jelas, metode tepat, penilaian objektif."],["Instruktur","Profesional, komunikatif, memotivasi."],["Peserta","Aktif, disiplin, bertanggung jawab, kolaboratif."]]},callout:"<b>Rumus sederhana:</b> Lingkungan Efektif = (Fisik + Psikologis + Sosial + Akademik) × Konsistensi Instruktur."},
  andragogy:{intro:"Fokus: peserta memecahkan masalah lingkungan belajar yang nyata.",scenarios:[
    {t:"Skenario 1 — Taruna Tidak Mau Bertanya",d:"Di kelas Anda, tidak ada satu pun taruna yang berani bertanya meskipun materi sulit.",task:"<b>Tugas:</b> (1) Diagnosis: dimensi lingkungan mana yang bermasalah? (2) Rancang 5 intervensi konkret. (3) Bagaimana mengukur perubahan? (4) Praktikkan salah satu intervensi (role play)."},
    {t:"Skenario 2 — Kelas Ramai & Bising",d:"Ruang kelas dekat area praktik. Kebisingan mengganggu. Peserta 45 orang, kursi fix. Metode diskusi kelompok sulit diterapkan.",task:"<b>Tugas:</b> Rancang solusi kreatif dengan sumber daya terbatas."},
    {t:"Skenario 3 — Konflik Antar Peserta",d:"Dua kelompok taruna berselisih karena pembagian tugas praktik dianggap tidak adil.",task:"<b>Tugas:</b> Rancang proses mediasi. Susun skrip percakapan instruktur. Tentukan aturan kelas baru."}

  summary:"Kompetensi sebagai perpaduan K-S-A dan pengelompokannya: teknis, perilaku, manajerial.",
  objectives:["Menjelaskan definisi kompetensi sebagai perpaduan K-S-A.","Membedakan kompetensi teknis, perilaku, dan manajerial.","Mengaitkan konsep kompetensi dengan kebutuhan jabatan di kapal."],
  pedagogy:{intro:"Fokus: peserta memahami kompetensi bukan sekadar 'bisa', tetapi 'bisa + paham + berperilaku tepat'.",blocks:[
    {h:"1. Definisi Kompetensi",items:["Kompetensi adalah perpaduan antara Pengetahuan (Knowledge), Keterampilan (Skill), dan Sikap (Attitude) yang diaplikasikan untuk menyelesaikan tugas secara efektif dan unggul.","Kompetensi bersifat terukur, dapat dievaluasi, dan terus dikembangkan melalui pelatihan atau pengalaman kerja."]},
    {h:"2. Jenis Kompetensi",items:["<b>Kompetensi Teknis (Hard Skills)</b> — kemampuan khusus/penguasaan ilmu yang berkaitan langsung dengan pekerjaan. Contoh: akuntansi, pemrograman, mengoperasikan mesin.","<b>Kompetensi Perilaku (Soft Skills)</b> — atribut kepribadian yang mendukung cara bekerja dan berinteraksi. Contoh: komunikasi, problem solving, teamwork.","<b>Kompetensi Manajerial (Managerial Skills)</b> — kemampuan memimpin, mengatur SDM, dan mengambil keputusan."]},
    {h:"3. Hubungan K-S-A",items:["Knowledge tanpa Skill = hanya teori, tidak bisa bertindak.","Skill tanpa Attitude = berbahaya, berpotensi melanggar prosedur keselamatan.","Attitude tanpa Knowledge = niat baik tapi salah arah.","Kompetensi sejati = irisan ketiganya."]},
    {h:"4. Relevansi di Dunia Maritim",items:["Seorang Master membutuhkan kompetensi teknis (navigasi, stabilitas), perilaku (kepemimpinan, komunikasi), dan manajerial (pengambilan keputusan, manajemen kru).","STCW mengukur kompetensi melalui bukti kinerja, bukan hanya jam belajar."]}
  ],table:{head:["Jenis Kompetensi","Contoh di Kapal"],rows:[["Teknis (Hard Skills)","Navigasi, operasi mesin, pemadaman kebakaran, ECDIS."],["Perilaku (Soft Skills)","Komunikasi bridge team, kerja sama, resolusi konflik."],["Manajerial","Pengambilan keputusan, manajemen SDM, kepemimpinan."]]},callout:"<b>Pesan kunci:</b> 'Kompeten' bukan berarti 'tidak pernah salah' — tetapi 'mampu menunjukkan kinerja sesuai standar secara konsisten'."},
  andragogy:{intro:"Fokus: peserta menilai dan mengembangkan kompetensi dirinya serta bawahannya.",scenarios:[
    {t:"Skenario 1 — Penilaian Kompetensi Kru",d:"Anda sebagai Chief Officer harus menilai seorang Able Seaman yang secara teknis sangat cakap tetapi sering membangkang perintah dan tidak mau bekerja sama.",task:"<b>Tugas:</b> Buat profil kompetensi orang tersebut (K-S-A). Tentukan kekuatan, kesenjangan, dan rencana pengembangan 3 bulan."},
    {t:"Skenario 2 — Promosi Jabatan",d:"Dua kandidat untuk posisi 2nd Engineer: (A) sangat teknis, kurang komunikatif; (B) komunikatif, teknis sedang.",task:"<b>Diskusi:</b> Siapa yang Anda pilih dan mengapa? Gunakan kerangka K-S-A. Bagaimana mengembangkan kandidat yang tidak dipilih?"}
  ],exercises:["Buat self-assessment kompetensi Anda sendiri (K-S-A) untuk jabatan saat ini.","Identifikasi 3 kesenjangan kompetensi Anda; susun rencana pengembangan 6 bulan.","Latihan: dari 5 tugas rutin di kapal, identifikasi kompetensi yang paling kritis untuk keselamatan."],reflection:["Kompetensi mana yang paling lemah dalam diri saya — dan apakah saya jujur mengakuinya?","Bagaimana saya bisa mengembangkan 'attitude' pada orang lain?"]},
  heutagogy:{intro:"Fokus: peserta merancang pengembangan kompetensi dirinya sendiri.",projects:[

    {t:"Proyek B — Kompetensi Model untuk Jabatan",d:"Rancang model kompetensi lengkap untuk satu jabatan di kapal (Master, C/O, 2/E).",out:"<b>Luaran:</b> Kamus kompetensi jabatan + instrumen asesmen."},
    {t:"Proyek C — Refleksi Kompetensi & Jurnal",d:"Selama 4 minggu, catat kejadian nyata di mana Anda menunjukkan (atau gagal menunjukkan) kompetensi tertentu.",out:"<b>Luaran:</b> Jurnal reflektif + analisis pola + pelajaran yang dipetik."}
  ],reflection:["Apa definisi 'sukses' bagi saya dalam pekerjaan ini — dan kompetensi apa yang dibutuhkan?","Jika saya harus mengajarkan kompetensi inti saya kepada orang lain, apa yang pertama saya ajarkan?"]}

{
  id:"m6", num:6, icon:"🛡️", pages:"ISM Code · SOLAS Bab IX",
  title:"ISM Code dalam SOLAS Bab IX",
  en:"International Safety Management Code — SOLAS Chapter IX",
  summary:"Dasar hukum, rantai sistem keselamatan, peran Company-Nakhoda-DPA, serta perbedaan DOC & SMC.",
  objectives:["Menjelaskan hubungan SOLAS Bab IX dan ISM Code.","Membedakan ISM Code, SMS, DPA, DOC, dan SMC.","Memahami penerapan keselamatan dan pencegahan pencemaran dalam operasi kapal."],
  pedagogy:{intro:"Fokus: peserta memahami ISM Code sebagai kerangka MANAJEMEN keselamatan kapal — bukan sekadar sertifikat.",blocks:[
    {h:"1. Apa itu ISM Code?",items:["<ref>ISM Code</ref> = International Safety Management Code.","Standar internasional untuk manajemen dan pengoperasian kapal secara aman.","Tujuannya juga mencakup pencegahan pencemaran lingkungan.","Menjadi wajib melalui amendemen SOLAS 1994."]},
    {h:"2. Dasar Hukum: SOLAS Bab IX",items:["Nama bab: Management for the Safe Operation of Ships.","Diwajibkan melalui amendemen <ref>SOLAS</ref> 1994.","Bab IX dan kewajiban ISM mulai berlaku pada <b>1 Juli 1998</b>."]},
    {h:"3. Rantai Sistem Keselamatan",items:["<ref>SOLAS</ref> Bab IX → dasar kewajiban internasional.","<ref>ISM Code</ref> → standar manajemen keselamatan.","<ref>SMS</ref> → sistem dan prosedur yang diterapkan perusahaan serta kapal.","Pelaksanaan → tindakan nyata, latihan, pelaporan, evaluasi, dan perbaikan."]},
    {h:"4. Siapa Melakukan Apa?",items:["<b>Company</b>: memastikan SMS tersedia, diterapkan, dan didukung sumber daya.","<b>Nakhoda</b>: memimpin keselamatan kapal dan mengambil keputusan yang diperlukan.","<b><ref>DPA</ref></b>: penghubung kapal–darat serta pemantau aspek keselamatan dan pencemaran.","<b>Seluruh personel</b>: memahami tugas dan mengikuti prosedur yang berlaku."]},
    {h:"5. DOC dan SMC: Jangan Tertukar",items:["<b><ref>DOC</ref></b> (Document of Compliance): sertifikat untuk <b>PERUSAHAAN</b>.","<b><ref>SMC</ref></b> (Safety Management Certificate): sertifikat untuk <b>KAPAL</b>.","Keduanya berkaitan dengan verifikasi terhadap penerapan ISM Code/SMS."]},
    {h:"6. Contoh Penerapan di Kapal",items:["Risiko kerja diidentifikasi sebelum pekerjaan dimulai.","Prosedur kerja aman dan penggunaan PPE diterapkan.","Latihan keadaan darurat dilaksanakan sesuai rencana.","Insiden, near miss, dan ketidaksesuaian dilaporkan untuk pembelajaran."]},
    {h:"7. ISM Code vs ISPS Code",items:["<b>ISM Code</b>: keselamatan operasi kapal dan pencegahan pencemaran.","<b><ref>ISPS Code</ref></b>: keamanan kapal dan fasilitas pelabuhan.","Keduanya berbeda tujuan, meskipun sama-sama terkait tata kelola kapal."]}
  ],table:{head:["Istilah","Peruntukan"],rows:[["<ref>ISM Code</ref>","Standar manajemen keselamatan & pencegahan pencemaran."],["<ref>SMS</ref>","Sistem & prosedur yang diterapkan perusahaan dan kapal."],["<ref>DPA</ref>","Penghubung kapal–darat, pemantau keselamatan & pencemaran."],["<ref>DOC</ref>","Sertifikat untuk PERUSAHAAN."],["<ref>SMC</ref>","Sertifikat untuk KAPAL."],["<ref>ISPS Code</ref>","Keamanan kapal & fasilitas pelabuhan (berbeda dari ISM)."]]},callout:"<b>Ingat:</b> DOC = <b>D</b>arat/<b>D</b>ompany → Perusahaan. SMC = <b>S</b>hip → Kapal. Jangan tertukar!"},
  andragogy:{intro:"Fokus: peserta memecahkan masalah penerapan ISM Code di kapal & perusahaan.",scenarios:[
    {t:"Skenario 1 — Audit DOC & SMC",d:"Sebuah perusahaan pelayaran akan diaudit oleh Recognized Organization. Perusahaan memiliki 3 kapal. Dua kapal sudah punya SMC, satu belum. DOC perusahaan hampir kadaluarsa.",task:"<b>Tugas:</b> (1) Susun checklist persiapan audit. (2) Tentukan dokumen apa saja yang harus disiapkan untuk DOC dan SMC. (3) Siapa yang bertanggung jawab atas masing-masing dokumen? (4) Simulasikan sesi tanya-jawab auditor."},
    {t:"Skenario 2 — Near Miss Tidak Dilaporkan",d:"Di sebuah kapal, terjadi near miss (hampir kecelakaan) saat mooring. Kru tidak melaporkan karena takut dianggap tidak kompeten. Sebulan kemudian terjadi kecelakaan serius dengan penyebab yang sama.",task:"<b>Analisis:</b> (1) Di mana kelemahan SMS? (2) Mengapa budaya pelaporan tidak terbangun? (3) Rancang sistem pelaporan near miss yang aman & anonim. (4) Bagaimana DPA seharusnya berperan?"},
    {t:"Skenario 3 — Kesalahan Identifikasi DOC vs SMC",d:"Seorang surveyor PSC menemukan bahwa kapal memiliki SMC valid, tetapi DOC perusahaan sudah kadaluarsa. Kapten berargumen bahwa 'sertifikat kapal masih berlaku'.",task:"<b>Diskusi:</b> Apakah argumen kapten benar? Jelaskan hubungan DOC dan SMC menurut ISM Code. Apa konsekuensi hukum bagi kapal dan perusahaan?"}
  ],exercises:["Buat diagram alur 'Rantai Sistem Keselamatan' dari SOLAS Bab IX hingga pelaksanaan di kapal.","Buat tabel perbandingan ISM Code vs ISPS Code (tujuan, cakupan, sertifikat).","Simulasi: berperan sebagai DPA, tangani laporan ketidaksesuaian dari 2 kapal berbeda.","Latihan: identifikasi 5 near miss di tempat kerja Anda dan tentukan tindakan pencegahannya."],reflection:["Apakah saya memahami perbedaan DOC dan SMC — dan mengapa perbedaan itu penting?","Bagaimana saya bisa berkontribusi pada budaya pelaporan yang sehat di kapal?","Apa yang akan saya lakukan jika menemukan ketidaksesuaian antara SMS dan praktik nyata?"]},
  heutagogy:{intro:"Fokus: peserta menciptakan alat bantu, sistem, dan inovasi untuk penerapan ISM Code.",projects:[
    {t:"Proyek A — Rancangan SMS Mini untuk Kapal Kecil",d:"Rancang kerangka SMS sederhana (5–10 prosedur inti) untuk kapal kecil (mis. kapal penyeberangan atau kapal latih).",out:"<b>Luaran:</b> Dokumen SMS mini + bagan organisasi + matriks tanggung jawab."},
    {t:"Proyek B — Sistem Pelaporan Near Miss Digital",d:"Ciptakan prototipe sistem pelaporan near miss (formulir, alur, anonimitas, tindak lanjut) berbasis digital.",out:"<b>Luaran:</b> Prototipe sistem + SOP + panduan penggunaan."},
    {t:"Proyek C — Simulasi Audit Internal DOC/SMC",d:"Rancang skenario simulasi audit internal lengkap dengan daftar pertanyaan, peran, dan rubrik penilaian.",out:"<b>Luaran:</b> Paket simulasi + lembar observasi + laporan audit contoh."},
    {t:"Proyek D — Media Edukasi ISM Code",d:"Ciptakan media ajar (poster/video/infografis) yang menjelaskan ISM Code ke kru kapal baru.",out:"<b>Luaran:</b> Karya media + narasi + kuis penguatan."}
  ],reflection:["Jika saya harus merancang SMS dari nol, apa prinsip utamanya?","Bagaimana saya bisa membuat pelaporan insiden terasa aman, bukan menghukum?","Apa peran saya (sebagai instruktur) dalam membangun budaya keselamatan?"]}
}

function navBtn(id, ic, label){

  STATE.view = view;

}

/* ============================================================
   POPUP
   ============================================================ */
function openPopup(key){
  const r = REFS[key];
  if(!r){ return; }
  document.getElementById("popTag").textContent = "REFERENSI · " + key;
  document.getElementById("popTitle").textContent = r.title;
  document.getElementById("popSub").textContent = r.full;
  document.getElementById("popDesc").textContent = r.desc;
  document.getElementById("popLinks").innerHTML = r.links.map(l=>
    `<a href="${l.u}" target="_blank" rel="noopener" class="${l.cls}">
      <span class="lic">${l.ic}</span>
      <span>${l.t}</span>
      <span class="lmeta">${l.meta} ↗</span>
    </a>`
  ).join("");
  const related = (r.tags||[]).map(t=>{
    const hasRef = REFS[t];
    return hasRef ? `<button onclick="openPopup('${t}')">${t}</button>` : `<button onclick="openPopup('${t}')">${t}</button>`;
  }).join("");
  document.getElementById("popRelated").innerHTML = related ?
    `<b>Istilah Terkait</b><div class="tags">${related}</div>` : "";
  document.getElementById("popupBg").classList.add("on");
  document.body.style.overflow = "hidden";
}
function closePopup(){
  document.getElementById("popupBg").classList.remove("on");
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ closePopup(); document.getElementById("sidebar").classList.remove("open"); document.getElementById("overlay").classList.remove("on"); }
});

/* ============================================================
   RENDER HELPERS
   ============================================================ */
function setCrumb(txt){ document.getElementById("crumb").innerHTML = txt; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// Convert <ref>KEY</ref> to clickable span
function processRefs(html){
  return html.replace(/<ref>([^<]+)<\/ref>/g, (m,k)=>{
    const key = k.trim();
    const safe = key.replace(/'/g,"\\'");
    return `<span class="ref" onclick="openPopup('${safe}')" title="Klik untuk referensi: ${key}">${key}</span>`;
  });
}

function blockHTML(b){
  return `<div class="blk">
    <h4><span class="dot"></span>${b.h}</h4>
    <ul>${b.items.map(i=>`<li>${processRefs(i)}</li>`).join("")}</ul>
  </div>`;
}
function tableHTML(t){
  if(!t) return "";
  return `<table class="tbl"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
  <tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${processRefs(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

   VIEW: KUIS
   ============================================================ */
function viewQuiz(){
  setCrumb("Kuis Kompetensi");
  const total = QUIZ.length;
  const answered = Object.keys(STATE.quizAnswers).length;
  const sub = STATE.quizSubmitted;

  let scoreHTML = "";
  if(sub){
    let correct = 0;
    QUIZ.forEach((q,i)=>{ if(STATE.quizAnswers[i]===q.a) correct++; });
    const pct = Math.round(correct/total*100);
    let msg = pct>=80 ? "🎉 Luar biasa! Anda siap menjadi instruktur CBT." :
              pct>=60 ? "👍 Baik. Pelajari kembali modul yang masih lemah." :
                        "📚 Perlu pengulangan. Baca ulang modul 1–6 secara berurutan.";
    scoreHTML = `<div class="score-box">
      <div class="big">${pct}%</div>
      <p>${correct} benar dari ${total} soal</p>
      <p style="margin-top:10px;font-size:15px;color:#fff;font-weight:600">${msg}</p>
    </div>`;
  }

  return `
  <div class="card">
    <div class="flex" style="justify-content:space-between;align-items:center">
      <div>
        <h2>📝 Kuis Kompetensi TOT 6.09 + ISM Code</h2>
        <p class="sub">${total} soal pilihan ganda · ${answered}/${total} dijawab</p>
      </div>
      ${sub?`<button class="btn gold" onclick="resetQuiz()">↺ Ulangi Kuis</button>`:""}
    </div>
  </div>

  ${scoreHTML}

  ${QUIZ.map((q,i)=>{
    const chosen = STATE.quizAnswers[i];
    return `<div class="qq">
      <div class="qn">SOAL ${i+1} DARI ${total}</div>
      <div class="qt">${processRefs(q.q)}</div>
      ${q.o.map((o,j)=>{
        let cls = "opt";
        if(sub){
          cls += " lock";
          if(j===q.a) cls += " correct";
          else if(chosen===j) cls += " wrong";
        }
        return `<label class="${cls}">
          <input type="radio" name="q${i}" ${chosen===j?"checked":""} ${sub?"disabled":""} onchange="answerQuiz(${i},${j})">
          <span>${String.fromCharCode(65+j)}. ${o}</span>
        </label>`;
      }).join("")}
      ${sub?`<div style="margin-top:8px;font-size:12.8px;background:#f0f9ff;border-left:3px solid var(--blue);padding:9px 12px;border-radius:6px;color:#1e3a8a">
        <b>Penjelasan:</b> ${q.e}</div>`:""}
    </div>`;
  }).join("")}

  ${!sub?`<div class="card" style="text-align:center">
    <button class="btn primary" style="padding:13px 34px;font-size:14px" onclick="submitQuiz()">
      ✓ Selesai & Lihat Hasil
    </button>
    <p class="sub" style="margin-top:10px">Pastikan semua soal telah dijawab.</p>
  </div>`:""}
  `;
}
function answerQuiz(i,j){
  STATE.quizAnswers[i] = j;
  STORE.quiz = STATE.quizAnswers;
  saveStore(STORE);
  const el = document.querySelector(".card .sub");
  const answered = Object.keys(STATE.quizAnswers).length;
  if(el) el.textContent = `${QUIZ.length} soal pilihan ganda · ${answered}/${QUIZ.length} dijawab`;
}
function submitQuiz(){
  const answered = Object.keys(STATE.quizAnswers).length;
  if(answered < QUIZ.length){
    if(!confirm(`Baru ${answered} dari ${QUIZ.length} soal dijawab. Lanjut menilai?`)) return;
  }
  STATE.quizSubmitted = true;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function resetQuiz(){
  STATE.quizAnswers = {}; STATE.quizSubmitted = false;
  STORE.quiz = {}; saveStore(STORE);
  render();
}

    </div>
  </div>

  <div class="card">
    <h2>🏫 Praktik Baik untuk Lembaga Vokasi Pelayaran</h2>
    <p class="sub" style="margin-bottom:14px">Diambil dari prinsip CBT, ISM Code, dan tiga pendekatan pembelajaran.</p>
    ${APLIKASI.praktik.map(u=>`
      <div class="blk">
        <h4><span class="dot" style="background:var(--purple)"></span>${u.t}</h4>
        <p style="font-size:13.5px;color:#33506e">${u.d}</p>
      </div>
    `).join("")}
  </div>

  <div class="card">
    <h2>✅ Rencana Aksi Instruktur (Checklist)</h2>
    <p class="sub" style="margin-bottom:12px">Centang untuk menandai kemajuan implementasi Anda.</p>
    <div id="actionList">
      ${APLIKASI.actionChecklist.map((a,i)=>`
        <label class="cl-item ${STORE.checklist&&STORE.checklist[i]?'done':''}" id="cl-${i}">
          <input type="checkbox" ${STORE.checklist&&STORE.checklist[i]?"checked":""} onchange="toggleCheck(${i})">
          <span>${a}</span>
        </label>
      `).join("")}
    </div>
  </div>

  <div class="card">
    <h2>🎯 Inti Penerapan</h2>
    <div class="grid g3">
      <div style="background:var(--blue-l);border-radius:11px;padding:16px;border-left:4px solid var(--blue)">
        <b style="color:#1e40af;font-size:12px;letter-spacing:1px">PEDAGOGI</b>
        <p style="font-size:13px;margin-top:6px;color:#1e3a8a">Instruktur menguasai <b>dasar K-S-A</b> STCW, ISM Code, SOLAS melalui pengajaran terstruktur, demonstrasi, dan latihan terbimbing.</p>
      </div>
      <div style="background:var(--teal-l);border-radius:11px;padding:16px;border-left:4px solid var(--teal)">
        <b style="color:#115e59;font-size:12px;letter-spacing:1px">ANDRAGOGI</b>
        <p style="font-size:13px;margin-top:6px;color:#134e4a">Instruktur <b>memecahkan masalah nyata</b> di simulator, kapal latih, dan industri melalui studi kasus, audit DOC/SMC, & debriefing terstruktur.</p>
      </div>
      <div style="background:var(--purple-l);border-radius:11px;padding:16px;border-left:4px solid var(--purple)">
        <b style="color:#5b21b6;font-size:12px;letter-spacing:1px">HEUTAGOGI</b>
        <p style="font-size:13px;margin-top:6px;color:#4c1d95">Instruktur <b>menentukan cara belajar sendiri</b> dan menciptakan solusi, karya, serta inovasi di bidang pendidikan maritim.</p>
      </div>
    </div>
    <div class="callout" style="margin-top:18px">
      <b>Hasil akhir yang diharapkan:</b> Instruktur pelayaran yang bukan hanya <i>competent</i> menurut standar STCW & ISM Code, tetapi juga <i>adaptive</i>, <i>reflective</i>, dan <i>self-directed</i> — siap menghadapi perubahan teknologi dan regulasi maritim global.
    </div>
  </div>
  `;
}
function toggleCheck(i){
  if(!STORE.checklist) STORE.checklist = {};
  STORE.checklist[i] = !STORE.checklist[i];
  saveStore(STORE);
  const el = document.getElementById("cl-"+i);
  if(el) el.classList.toggle("done", STORE.checklist[i]);
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  let html = "";
  if(STATE.view === "dashboard") html = viewDashboard();
  else if(STATE.view === "dbmateri") html = viewDB();
  else if(STATE.view === "glosarium") html = viewGlosarium();
  else if(STATE.view === "kuis") html = viewQuiz();
  else if(STATE.view === "aplikasi") html = viewAplikasi();
  else if(STATE.view.startsWith("mod:")) html = viewModule(STATE.moduleId);
  else html = viewDashboard();
  app.innerHTML = html;
  if(STATE.view === "dbmateri") renderDBTable();
}

function resetAll(){
  if(!confirm("Reset semua progres, catatan, dan jawaban kuis? Tindakan ini tidak dapat dibatalkan.")) return;
  STORE = {done:{}, notes:{}, quiz:{}, checklist:{}};
  saveStore(STORE);
  STATE = {view:"dashboard", moduleId:null, tab:"pedagogi", dbFilter:"", glosFilter:"", quizAnswers:{}, quizSubmitted:false};
  renderNav(); render();
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  if(STORE.quiz && Object.keys(STORE.quiz).length){ STATE.quizAnswers = STORE.quiz; }
  renderNav();
  render();
})();
</script>
</body>
</html>
